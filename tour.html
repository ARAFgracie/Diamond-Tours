<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diamond Tours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Zilla+Slab:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="tour" data-title="Itinerary" data-footer="__home">

<div id="siteNav"></div>

<header class="page-head">
  <div class="tag" data-t="tour.head.tag"></div>
  <h1 class="display" data-t="tour.head.title" data-accent></h1>
  <p data-t="tour.head.text"></p>
</header>

<section class="timeline" id="days"></section>

<section class="included">
  <div>
    <div class="tag" data-t="tour.included.tag"></div>
    <h2 class="display" data-t="tour.included.title" data-accent></h2>
  </div>
  <div class="include-grid" id="includeGrid"></div>
</section>

<section class="block">
  <div class="final compact">
    <h2 class="display" data-t="tour.cta.title" data-accent></h2>
    <a href="registration.html" class="btn btn-accent"><span data-t="tour.cta.button"></span> <span>↗</span></a>
  </div>
</section>

<div id="siteFooter"></div>
<script src="content.js"></script>
<script src="Script.js"></script>
</body>
</html>
