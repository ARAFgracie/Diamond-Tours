<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diamond Tours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Zilla+Slab:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="registration" data-title="Registration" data-footer="registration.footer">

<div id="siteNav"></div>

<div class="form-wrap">
  <div class="form-intro">
    <div class="tag" data-t="registration.tag"></div>
    <h1 class="display" data-t="registration.title" data-accent></h1>
    <p data-t="registration.text"></p>
    <div class="mini-trip"><strong data-t="trip.name"></strong><span id="miniTripInfo"></span></div>
  </div>

  <form id="registerForm">
    <div class="form-section"><span>01</span><h3>About you</h3></div>
    <label>Full name<input required name="name" placeholder="e.g. Araf Hossain"></label>
    <div class="two">
      <label>Phone number<input required name="phone" placeholder="+880 1XXX XXX XXX"></label>
      <label>Email address<input type="email" name="email" placeholder="you@example.com"></label>
    </div>
    <label>Institution / workplace<input name="institution" placeholder="Where are you from?"></label>

    <div class="form-section space"><span>02</span><h3>Trip details</h3></div>
    <label>Number of seats<select name="seats" id="seatSelect"></select></label>
    <label>Anything we should know? <small>optional</small><textarea name="note" placeholder="Food preference, special request, etc."></textarea></label>
    <label class="check"><input type="checkbox" required> I have read the tour details and agree to the registration guidelines.</label>

    <button class="btn btn-accent submit" type="submit"><span data-t="registration.submit"></span> <span>↗</span></button>
    <p class="demo-note" data-t="registration.note"></p>
  </form>
</div>

<div id="siteFooter"></div>
<script src="content.js"></script>
<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase.js"></script>
<script src="Script.js"></script>
</body>
</html>
