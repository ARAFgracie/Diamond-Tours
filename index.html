<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diamond Tours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Zilla+Slab:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="home" data-footer="home.footer">

<header class="hero" id="top">
  <div class="hero-bg" data-bg="images.hero"></div>
  <div class="hero-frame">

    <div id="siteNav" class="nav"></div>

    <div class="seat-card" id="seatCard">
      <h3 data-t="home.card.title"></h3>
      <div class="seat-label" data-t="home.card.seatsLabel"></div>
      <div class="seat-pills" id="seatPills"></div>
      <div class="seat-total"><span data-t="home.card.totalLabel"></span><strong id="seatTotal"></strong></div>
      <p class="seat-note" id="seatNote"></p>
      <a class="btn btn-accent" id="seatBook" href="registration.html"><span data-t="home.card.button"></span> <span>↗</span></a>
    </div>

    <h1 class="hero-title display" data-t="home.hero.title" data-accent></h1>
    <p class="hero-text" data-t="home.hero.text"></p>
  </div>
</header>

<main>

  <section class="sec" id="trip">
    <div class="showcase">
      <div class="sc-head">
        <div>
          <h2 class="sc-title" data-t="home.showcase.title"></h2>
          <div class="sc-tags" id="scTags"></div>
        </div>
        <div class="sc-meta">
          <div class="sc-price"><span id="scPrice"></span><small>pp</small></div>
          <div class="sc-actions">
            <button class="heart" id="heartBtn" type="button" aria-label="Save this trip">♡</button>
            <a class="pill pill-accent" href="registration.html" data-t="home.showcase.button"></a>
          </div>
        </div>
      </div>
      <div class="bento" id="bento"></div>
    </div>
  </section>

  <section class="sec" id="about">
    <div class="idea">
      <div class="tag" data-t="home.idea.tag"></div>
      <div>
        <h2 class="display sec-title" data-t="home.idea.title" data-accent></h2>
        <p class="lead" data-t="home.idea.text"></p>
      </div>
    </div>
    <div class="stats" id="stats"></div>
  </section>

  <section class="sec" id="experience">
    <div class="hl">
      <div class="hl-head">
        <div class="tag" data-t="home.highlights.tag"></div>
        <h2 class="display" data-t="home.highlights.title"></h2>
      </div>
      <div class="hl-grid" id="hlGrid"></div>
      <a href="tour.html" class="btn btn-light hl-link"><span data-t="home.highlights.link"></span> <span>→</span></a>
    </div>
  </section>

  <section class="moments" id="moments">
    <div class="m-head">
      <h2 class="display" data-t="home.moments.title" data-accent></h2>
      <p data-t="home.moments.text"></p>
    </div>
    <div class="m-track" id="mTrack"></div>
  </section>

  <section class="sec">
    <div class="final">
      <div class="tag" data-t="home.final.tag"></div>
      <h2 class="display" data-t="home.final.title" data-accent></h2>
      <p data-t="home.final.text"></p>
      <a href="registration.html" class="btn btn-accent"><span data-t="home.final.button"></span> <span>↗</span></a>
    </div>
  </section>

</main>

<div id="siteFooter"></div>
<script src="content.js"></script>
<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase.js"></script>
<script src="Script.js"></script>
</body>
</html>
