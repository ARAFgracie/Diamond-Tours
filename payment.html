<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diamond Tours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Zilla+Slab:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="payment" data-title="Payment" data-footer="payment.footer">

<div id="siteNav"></div>

<div class="payment-wrap">
  <div class="payment-head">
    <div class="tag" data-t="payment.tag"></div>
    <h1 class="display" data-t="payment.title" data-accent></h1>
    <p data-t="payment.text"></p>
  </div>

  <div class="payment-card">
    <div class="order">
      <div><span>TRIP</span><strong data-t="trip.name" style="text-transform:uppercase"></strong></div>
      <div><span>DATES</span><strong data-t="trip.dates"></strong></div>
      <div><span>AMOUNT</span><strong id="amount"></strong></div>
    </div>

    <div class="method-title">Choose payment method</div>
    <div class="methods">
      <button type="button" class="method active" data-method="card"><b>▣</b><span><strong>Card</strong><small>Visa / Mastercard</small></span><i>✓</i></button>
      <button type="button" class="method" data-method="bkash"><b>◉</b><span><strong>bKash</strong><small>Mobile payment</small></span><i>✓</i></button>
      <button type="button" class="method" data-method="nagad"><b>◆</b><span><strong>Nagad</strong><small>Mobile payment</small></span><i>✓</i></button>
    </div>

    <div id="cardBox" class="payment-fields">
      <label>Card number<input placeholder="1234 5678 9012 3456" inputmode="numeric"></label>
      <div class="two">
        <label>Expiry date<input placeholder="MM / YY"></label>
        <label>CVV<input placeholder="•••" type="password"></label>
      </div>
      <label>Cardholder name<input id="payer" placeholder="Name on card"></label>
    </div>

    <div id="mobileBox" class="payment-fields hidden">
      <div class="mobile-note"><strong id="mobileTitle">bKash payment</strong><p>In a real integration, this button would open the official payment gateway. For this demo, continue to the confirmation screen.</p></div>
      <label>Mobile number<input placeholder="01XXXXXXXXX" inputmode="numeric"></label>
    </div>

    <button id="payBtn" class="btn btn-accent submit" type="button">Pay <span>↗</span></button>
    <p class="demo-note" data-t="payment.note"></p>
  </div>
</div>

<div id="siteFooter"></div>
<script src="content.js"></script>
<script src="Script.js"></script>
</body>
</html>
