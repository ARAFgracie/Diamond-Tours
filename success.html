<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diamond Tours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Zilla+Slab:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="success-page" data-page="success" data-title="Registration Confirmed">

<div class="success-card">
  <a class="brand" data-brand href="index.html" style="justify-content:center;margin-bottom:22px"></a>
  <div class="success-icon">✓</div>
  <div class="tag" data-t="success.tag"></div>
  <h1 class="display" data-t="success.title" data-accent></h1>
  <p>Thanks, <strong id="guestName">traveller</strong>. <span data-t="success.text"></span></p>
  <div class="ticket">
    <div><span>TRIP</span><strong data-t="trip.name" style="text-transform:uppercase"></strong></div>
    <div><span>DATE</span><strong data-t="trip.dates"></strong></div>
    <div><span>STATUS</span><strong>CONFIRMED</strong></div>
    <div><span>REFERENCE</span><strong id="ref">DT-0000</strong></div>
  </div>
  <p class="small" data-t="success.small"></p>
  <a href="index.html" class="btn btn-accent"><span data-t="success.button"></span> <span>↗</span></a>
</div>
<script src="content.js"></script>
<script src="Script.js"></script>
</body>
</html>
